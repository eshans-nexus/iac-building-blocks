name: 'Module: AWS Smoke Test'

on:
  workflow_call:
    inputs:
      ami_id:
        required: true
        type: string
      refarch_type:
        required: true
        type: string
      matlab_version:
        required: true
        type: string
      region:
        required: true
        type: string
      metatemplate_file_path:
        required: true
        type: string
      lambda_injections:
        description: |
          JSON object mapping Lambda resource logical IDs in the template
          to source files to embed in their Code.ZipFile fields. Pass
          '{}' or omit when the template has no Lambda code to inject.
        required: false
        type: string
        default: '{}'
      mock_build:
        description: |
          True when the AMI came from a previous release rather than from the
          build in the calling workflow run, so tests asserting what that build
          produced are skipped.
        type: boolean
        default: false

env:
  METATEMPLATE_PATH: "./${{ inputs.metatemplate_file_path }}"
  TEMPLATE_FILENAME: "${{ inputs.matlab_version }}-test-template.json"
  TEST_ARTIFACT_NAME: "${{ inputs.matlab_version }}-test-template"
  # run_attempt keeps a re-run from reusing a stack an earlier attempt left behind.
  STACK_NAME: "mw-public-actions-${{ inputs.refarch_type }}-${{ inputs.matlab_version }}-${{ github.run_id }}-${{ github.run_attempt }}"
  TEST_REGION_MAP: '{"${{ inputs.region }}": {"AMI": "${{ inputs.ami_id }}"}}'
  BASE_DIR: ${{ github.workspace }}

jobs:
  smoke-test:
    name: "${{ inputs.matlab_version }}: Run smoke tests"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Validate Inputs
        run: |
          if [ -z "${{ inputs.region }}" ]; then
            echo "::error::Region input is empty. The build step may have failed to produce outputs."
            exit 1
          fi
          if [ -z "${{ inputs.ami_id }}" ]; then
            echo "::error::AMI ID input is empty. The build step may have failed to produce outputs."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Check out the CI scripts
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .iac-building-blocks

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.5

      - name: Generate test template
        env:
          TEMPLATE: ${{ env.METATEMPLATE_PATH }}
          REGION_MAP: ${{ env.TEST_REGION_MAP }}
          OUT_NAME: ${{ env.TEMPLATE_FILENAME }}
          LAMBDA_INJECTIONS: ${{ inputs.lambda_injections }}
        run: mise -C .iac-building-blocks run aws:render-template

      - name: Upload test template
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TEST_ARTIFACT_NAME }}
          path: ${{ env.TEMPLATE_FILENAME }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BUILD_ROLE }}
          aws-region: ${{ inputs.region }}

      - name: Deploy Infrastructure
        id: deploy
        timeout-minutes: 20
        env:
          TEMPLATE_FILE: ${{ env.TEMPLATE_FILENAME }}
          REFARCH_TYPE: ${{ inputs.refarch_type }}
          REGION: ${{ inputs.region }}
          VPC: ${{ secrets.TEST_VPC_ID }}
          SUBNET: ${{ secrets.TEST_SUBNET_ID }}
          KEY: ${{ vars.EC2_KEY_NAME }}
          STAGING_BUCKET: ${{ vars.TEMPLATE_STAGING_BUCKET }}
        run: mise -C .iac-building-blocks run aws:deploy-stack

      - name: Run Smoke Tests
        id: smoke-test
        timeout-minutes: 10
        env:
          AWS_REGION: ${{ inputs.region }}
          MOCK_BUILD: ${{ inputs.mock_build }}
          EXPECTED_AMI_ID: ${{ inputs.ami_id }}
        run: mise run e2e

      - name: Cleanup
        if: always() && steps.deploy.outcome != 'skipped'
        env:
          REGION: ${{ inputs.region }}
        run: mise -C .iac-building-blocks run aws:delete-stack